<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แปลสด EN→TH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: control bar on top, newest translation big at the bottom, history scrolls above */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#14171c; --muted:#5d6673; --line:#dde1e7; --accent:#1f5fd1; --live:#c62828;
  --th:"IBM Plex Sans Thai",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1217; --panel:#171b22; --fg:#e9edf2; --muted:#9aa4b1; --line:#2a313b; --accent:#7aa7ff; --live:#ff6b6b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--th);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 auto 0 0;font-weight:600}
button,select{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
#dot.on{background:var(--live);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){#dot.on{animation:none}}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%;margin:0 auto}
.item{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.th{font-size:20px;line-height:1.55}
.en{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.5}
.t{font-family:var(--mono);font-size:11px;color:var(--muted)}
footer{background:var(--panel);border-top:1px solid var(--line);padding:14px 16px}
#interim{max-width:900px;margin:0 auto;font-family:var(--mono);font-size:14px;color:var(--muted);min-height:1.5em}
#help{max-width:900px;margin:0 auto;font-size:14px;color:var(--muted);line-height:1.6}
#help b{color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>แปลสด อังกฤษ → ไทย</h1>
  <span id="status"><span id="dot"></span><span id="st">พร้อม</span></span>
  <select id="engine" aria-label="ตัวแปล">
    <option value="google">Google Translate</option>
    <option value="chrome">Chrome ในเครื่อง (ออฟไลน์)</option>
  </select>
  <button id="clear">ล้าง</button>
  <button id="go" class="primary">▶ เริ่มฟัง</button>
</header>
<main id="log">
  <div id="help">
    <b>วิธีใช้</b><br>
    1. เปิดไลฟ์ YouTube ในอีกแท็บหรืออีกเครื่อง ให้เสียงออก<b>ลำโพง</b> (ไม่ใช่หูฟัง)<br>
    2. กด <b>▶ เริ่มฟัง</b> แล้วอนุญาตไมโครโฟน<br>
    3. คำแปลไทยจะขึ้นทีละประโยค ช้ากว่าเสียงจริง 1–3 วินาที<br>
    ใช้ได้ใน <b>Google Chrome</b> หรือ <b>Edge</b> บนคอมพิวเตอร์ (ต้องต่ออินเทอร์เน็ต)
  </div>
</main>
<footer><div id="interim"></div></footer>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const log = $('log'), interim = $('interim'), st = $('st'), dot = $('dot'), go = $('go');
let rec = null, listening = false, chromeTr = null;

// ศัพท์เฉพาะ Fed ที่เครื่องแปลมักแปลเพี้ยน
const GLOSSARY = [
  [/\bthe Fed\b/gi,'the Federal Reserve'],
  [/\bFOMC\b/g,'FOMC (Federal Open Market Committee)'],
  [/\bQT\b/g,'quantitative tightening'],
  [/\bQE\b/g,'quantitative easing'],
  [/\bbasis points?\b/gi,'basis points (bps)'],
];
const prep = s => GLOSSARY.reduce((a,[r,v])=>a.replace(r,v), s);

async function translateGoogle(text){
  const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=th&dt=t&q=' + encodeURIComponent(text);
  const r = await fetch(u);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  return j[0].map(x=>x[0]).join('');
}
async function translateChrome(text){
  if(!('Translator' in self)) throw new Error('Chrome รุ่นนี้ไม่มีตัวแปลในเครื่อง');
  if(!chromeTr) chromeTr = await Translator.create({sourceLanguage:'en', targetLanguage:'th'});
  return chromeTr.translate(text);
}
async function translate(text){
  const t = prep(text);
  try { return $('engine').value==='chrome' ? await translateChrome(t) : await translateGoogle(t); }
  catch(e){
    if($('engine').value==='chrome'){ try{ return await translateGoogle(t);}catch(_){} }
    return '⚠ แปลไม่สำเร็จ: ' + e.message;
  }
}

function addItem(en){
  $('help')?.remove();
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const d = document.createElement('div'); d.className='item';
  const time = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  d.innerHTML = '<div class="t"></div><div class="th">…</div><div class="en"></div>';
  d.querySelector('.t').textContent = time;
  d.querySelector('.en').textContent = en;
  log.appendChild(d);
  if(atBottom) log.scrollTop = log.scrollHeight;
  translate(en).then(th=>{ d.querySelector('.th').textContent = th; if(atBottom) log.scrollTop = log.scrollHeight; });
}

function setStatus(on, msg){ dot.classList.toggle('on', on); st.textContent = msg; }

function start(){
  if(!SR){ setStatus(false,'เบราว์เซอร์นี้ไม่รองรับ ใช้ Chrome/Edge'); return; }
  rec = new SR();
  rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
  let buf = '';
  rec.onresult = e => {
    let tmp = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i];
      if(r.isFinal){ buf += ' ' + r[0].transcript.trim(); }
      else tmp += r[0].transcript;
    }
    // ส่งแปลเมื่อจบประโยค หรือยาวพอ
    if(buf.trim() && (/[.?!]$/.test(buf.trim()) || buf.split(' ').length > 6 || !tmp)){
      addItem(buf.trim()); buf = '';
    }
    interim.textContent = tmp;
  };
  rec.onerror = e => {
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){ listening=false; setStatus(false,'ไม่ได้รับอนุญาตใช้ไมค์'); go.textContent='▶ เริ่มฟัง'; }
    else if(e.error!=='no-speech' && e.error!=='aborted') setStatus(true,'ข้อผิดพลาด: '+e.error+' (กำลังต่อใหม่)');
  };
  rec.onend = () => { if(listening) try{ rec.start(); }catch(_){} };
  listening = true; rec.start();
  setStatus(true,'กำลังฟัง'); go.textContent='■ หยุด';
}
function stop(){ listening=false; rec && rec.stop(); setStatus(false,'หยุดแล้ว'); go.textContent='▶ เริ่มฟัง'; interim.textContent=''; }

go.onclick = () => listening ? stop() : start();
$('clear').onclick = () => { log.innerHTML=''; };
if(!SR) setStatus(false,'เบราว์เซอร์นี้ไม่รองรับ ใช้ Chrome/Edge');
</script>
</body>
</html>
