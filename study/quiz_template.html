<title>ข้อสอบฝึกการเงิน 4 วิชา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@600;700&display=swap">
<style>
/* Layout: one reading column; a sticky score strip on top, course chips to filter, questions as answer sheets. */
:root {
  --bg: #f4f7f5; --surface: #ffffff; --fg: #18211d; --muted: #5a6761; --line: #d5ded9;
  --accent: #0a7f4f; --accent-soft: #e3f3ea;
  --ok: #1a7f3c; --ok-soft: #e2f4e7; --bad: #b4372b; --bad-soft: #fbe7e4;
  --display: 'IBM Plex Sans Thai', 'Sarabun', 'Loma', sans-serif;
  --body: 'Sarabun', 'Loma', 'Noto Sans Thai', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111815; --surface: #19221e; --fg: #e3ebe6; --muted: #98a69f; --line: #2c3833;
  --accent: #3fbf86; --accent-soft: #1b3328; --ok: #5cc985; --ok-soft: #173223; --bad: #f08a7e; --bad-soft: #3a1f1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111815; --surface: #19221e; --fg: #e3ebe6; --muted: #98a69f; --line: #2c3833;
  --accent: #3fbf86; --accent-soft: #1b3328; --ok: #5cc985; --ok-soft: #173223; --bad: #f08a7e; --bad-soft: #3a1f1b; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 8px; }
h1 { font-family: var(--display); font-size: 1.75rem; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }

.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.strip .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
.chip { font: 600 0.9rem var(--body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.total { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); white-space: nowrap; }

.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 18px 0 6px; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.score .code { font-size: 0.78rem; letter-spacing: 0.04em; color: var(--muted); }
.score .name { font-weight: 600; font-size: 0.92rem; line-height: 1.35; }
.score .num { font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 700; margin-top: 4px; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.review { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }

h2 { font-family: var(--display); font-size: 1.2rem; margin: 30px 0 10px; padding-top: 6px; border-top: 2px solid var(--accent); }
h2 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.85rem; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 0 0 12px; }
.meta { display: flex; gap: 8px; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.02em; }
.meta .d { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.stem { margin: 0 0 10px; font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; text-align: left; width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt b { flex: none; width: 1.4em; color: var(--muted); }
.opt span { min-width: 0; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right b { color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong b { color: var(--bad); }
.exp { margin-top: 10px; padding: 8px 12px; background: var(--accent-soft); border-radius: 6px; font-size: 0.95rem; }
.exp .verdict { font-weight: 700; }
.exp .verdict.ok { color: var(--ok); } .exp .verdict.bad { color: var(--bad); }
.foot { display: flex; justify-content: flex-end; padding-block: 12px 40px; }
.btn { font: 600 0.95rem var(--body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 2px 3px; }
.frac > span { line-height: 1.3; padding: 0 3px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<header class="top wrap">
  <h1>ข้อสอบฝึก 4 รายวิชาการเงิน</h1>
  <p class="lede">วิชาละ 50 ข้อ รวม 200 ข้อ เลือกคำตอบแล้วเฉลยจะขึ้นทันที คะแนนแยกตามวิชาจะบอกว่าควรกลับไปทบทวนหัวข้อใดในเอกสารสอน</p>
</header>

<div class="strip"><div class="wrap" id="chips" role="toolbar" aria-label="เลือกวิชา"></div></div>

<main class="wrap">
  <div class="scores" id="scores"></div>
  <div id="list"></div>
  <div class="foot"><button class="btn" id="reset" type="button">ล้างคำตอบทั้งหมด</button></div>
</main>

<script>
/*DATA*/
const LET = "กขคง";
const KEY = "fin4-quiz-v2";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { answers = {}; }
let filter = "all";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} };
const el = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

function renderChips() {
  const box = document.getElementById("chips"); box.innerHTML = "";
  [{ id: "all", name: "ทุกวิชา" }, ...COURSES].forEach(c => {
    const b = el("button", "chip", c.id === "all" ? c.name : c.code);
    b.type = "button"; b.title = c.name; b.setAttribute("aria-pressed", String(filter === c.id));
    b.onclick = () => { filter = c.id; renderChips(); renderList(); };
    box.appendChild(b);
  });
  const t = el("span", "total"); t.id = "total"; box.appendChild(t);
  renderScores();
}

function renderScores() {
  const box = document.getElementById("scores"); box.innerHTML = "";
  let right = 0, done = 0;
  COURSES.forEach(c => {
    const qs = ITEMS.filter(x => x.c === c.id);
    const d = qs.filter(x => (x.c + x.n) in answers), r = d.filter(x => answers[x.c + x.n] === x.a);
    right += r.length; done += d.length;
    const miss = [...new Set(d.filter(x => answers[x.c + x.n] !== x.a).map(x => x.ref))];
    const card = el("div", "score");
    card.innerHTML = `<div class="code">${c.code}</div><div class="name">${c.name}</div>
      <div class="num">${r.length} / ${qs.length}</div>
      <div class="bar"><i style="width:${(r.length / qs.length) * 100}%"></i></div>
      <div class="review">${d.length === 0 ? "ยังไม่ได้ทำ" : miss.length ? "ทบทวนหัวข้อ " + miss.join(", ") : d.length === qs.length ? "ถูกทุกข้อ" : "ทำต่อได้เลย"}</div>`;
    box.appendChild(card);
  });
  const t = document.getElementById("total");
  if (t) t.textContent = `ถูก ${right} · ทำแล้ว ${done}/${ITEMS.length}`;
}

function renderQ(x) {
  const card = el("article", "q"); card.id = "q-" + x.c + x.n; const K = x.c + x.n;
  card.appendChild(el("div", "meta", `<span>ข้อ ${x.n}</span><span>หัวข้อ ${x.ref}</span><span class="d">${x.diff}</span>`));
  card.appendChild(el("p", "stem", x.q));
  const opts = el("div", "opts");
  const picked = answers[K];
  x.opts.forEach((o, k) => {
    const b = el("button", "opt", `<b>${LET[k]}.</b><span>${o}</span>`);
    b.type = "button";
    if (picked != null) {
      b.disabled = true;
      if (k === x.a) b.classList.add("right");
      else if (k === picked) b.classList.add("wrong");
    }
    b.onclick = () => { answers[K] = k; save(); card.replaceWith(renderQ(x)); renderScores(); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if (picked != null) {
    const ok = picked === x.a;
    card.appendChild(el("div", "exp", `<span class="verdict ${ok ? "ok" : "bad"}">${ok ? "ถูกต้อง" : "ยังไม่ถูก คำตอบคือ " + LET[x.a]}</span> · ${x.exp}`));
  }
  return card;
}

function renderList() {
  const box = document.getElementById("list"); box.innerHTML = "";
  COURSES.filter(c => filter === "all" || c.id === filter).forEach(c => {
    const qs = ITEMS.filter(x => x.c === c.id);
    box.appendChild(el("h2", "", `${c.name} <small>${c.code} · ${qs.length} ข้อ</small>`));
    qs.forEach(x => box.appendChild(renderQ(x)));
  });
}

document.getElementById("reset").onclick = () => { answers = {}; save(); renderList(); renderScores(); };
renderChips(); renderList();
</script>
